name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps
        run: pip install numpy pandas scipy h5py

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R deps
        run: Rscript -e 'install.packages(c("data.table", "jsonlite"))'

      - name: Run unit tests (skip Seurat-dependent)
        env:
          SKIP_SEURAT: "1"
        run: python tools/test_infrastructure.py